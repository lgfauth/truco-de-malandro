[build]
builder = "nixpacks"

[deploy]
startCommand = "bash -c 'if [ -f main.py ]; then exec uvicorn main:app --host 0.0.0.0 --port \"$PORT\"; else cd backend && exec uvicorn main:app --host 0.0.0.0 --port \"$PORT\"; fi'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
